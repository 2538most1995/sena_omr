# MAMP Apache -> local FastAPI API proxy.
# Included by /Applications/MAMP/conf/apache/httpd.conf.  Apache serves the
# frontend from DocumentRoot, so MAMP aliases such as /phpmyadmin stay usable.

ProxyRequests Off
ProxyPreserveHost On

ProxyPass        /sena_omr/api/ http://127.0.0.1:8000/api/ connectiontimeout=5 timeout=120
ProxyPassReverse /sena_omr/api/ http://127.0.0.1:8000/api/
ProxyPass        /api/ http://127.0.0.1:8000/api/ connectiontimeout=5 timeout=120
ProxyPassReverse /api/ http://127.0.0.1:8000/api/

